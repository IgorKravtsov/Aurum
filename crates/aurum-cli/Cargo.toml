[package]
name = "aurum-cli"
description = "Aurum command-line client (Rust port of the Node CLI, built on aurum-client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "aurum_cli"
path = "src/lib.rs"

[[bin]]
name = "aurum"
path = "src/main.rs"

[dependencies]
aurum-client = { workspace = true }
include_dir = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
