name: CI

# Runs on every pull request and on pushes to main, so a broken PR shows a
# red check before it's mergeable (enable "Require status checks to pass"
# in branch protection for main to actually block the merge button on it).
on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN: these jobs only ever read the checkout.
# Without this the token inherits the repository default, which can include
# write access — handed to every third-party action in the run.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      # A real Postgres, not sqlite — tests/conftest.py creates/migrates/
      # drops a dedicated aurum_test database against it, same as the local
      # `docker compose exec backend pytest` workflow in tests/README.md.
      # The suite is black-box: it starts the backend as a separate server
      # process (AURUM_TEST_SERVER picks Python or Rust) and only talks HTTP.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum
          POSTGRES_DB: aurum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURUM_POSTGRES_USER: aurum
      AURUM_POSTGRES_PASSWORD: aurum
      AURUM_POSTGRES_DB: aurum
      AURUM_POSTGRES_HOST: localhost
      AURUM_POSTGRES_PORT: 5432
      AURUM_TEST_SERVER: python
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # Same black-box suite against the Rust rewrite (crates/aurum-server).
  # Every step after the check is skipped until that crate exists, so this
  # job stays green on branches that predate it.
  backend-tests-rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum
          POSTGRES_DB: aurum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURUM_POSTGRES_USER: aurum
      AURUM_POSTGRES_PASSWORD: aurum
      AURUM_POSTGRES_DB: aurum
      AURUM_POSTGRES_HOST: localhost
      AURUM_POSTGRES_PORT: 5432
      AURUM_TEST_SERVER: rust
    steps:
      - uses: actions/checkout@v7
      - id: crate
        run: |
          if [ -f crates/aurum-server/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.crate.outputs.present == 'true'
        run: cargo build -p aurum-server
      - if: steps.crate.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - if: steps.crate.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - if: steps.crate.outputs.present == 'true'
        working-directory: backend
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b (type-check) then vite build — catches both a broken build
      # and a type error a PR might introduce, same as `npm run build`
      # locally before shipping a change.
      - run: npm run build
      # Vitest over the pure-logic modules (lib/format.ts, the Crypto tab's
      # allocation math) — kept in the same job rather than a new one so a
      # renamed job doesn't silently stop matching branch protection's
      # required status checks.
      - run: npm run test

  # The Rust CLI and its HTTP client. The tests are black-box: they run the
  # real `aurum` binary against an in-process mock server, so no database or
  # backend is needed. (The workspace-wide server build/tests live in the
  # backend-tests-rust job above.)
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p aurum-cli -p aurum-client --check
      # --no-deps: lint only these two crates, not the shared aurum-domain.
      - run: cargo clippy -p aurum-cli -p aurum-client --all-targets --no-deps -- -D warnings
      - run: cargo test -p aurum-cli -p aurum-client
