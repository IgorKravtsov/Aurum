name: CI

# Runs on every pull request and on pushes to main, so a broken PR shows a
# red check before it's mergeable (enable "Require status checks to pass"
# in branch protection for main to actually block the merge button on it).
on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN: these jobs only ever read the checkout.
# Without this the token inherits the repository default, which can include
# write access — handed to every third-party action in the run.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      # A real Postgres, not sqlite — tests/conftest.py creates/migrates/
      # drops a dedicated aurum_test database against it, same as the local
      # `docker compose exec backend pytest` workflow in tests/README.md.
      # The suite is black-box: it starts the backend as a separate server
      # process (AURUM_TEST_SERVER picks Python or Rust) and only talks HTTP.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum
          POSTGRES_DB: aurum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURUM_POSTGRES_USER: aurum
      AURUM_POSTGRES_PASSWORD: aurum
      AURUM_POSTGRES_DB: aurum
      AURUM_POSTGRES_HOST: localhost
      AURUM_POSTGRES_PORT: 5432
      AURUM_TEST_SERVER: python
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # Same black-box suite against the Rust rewrite (crates/aurum-server).
  # Every step after the check is skipped until that crate exists, so this
  # job stays green on branches that predate it. Its Rust port runs in the
  # `rust` job below; this one goes away together with backend/.
  backend-tests-rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum
          POSTGRES_DB: aurum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURUM_POSTGRES_USER: aurum
      AURUM_POSTGRES_PASSWORD: aurum
      AURUM_POSTGRES_DB: aurum
      AURUM_POSTGRES_HOST: localhost
      AURUM_POSTGRES_PORT: 5432
      AURUM_TEST_SERVER: rust
    steps:
      - uses: actions/checkout@v7
      - id: crate
        run: |
          if [ -f crates/aurum-server/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.crate.outputs.present == 'true'
        run: cargo build -p aurum-server
      - if: steps.crate.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - if: steps.crate.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - if: steps.crate.outputs.present == 'true'
        working-directory: backend
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b (type-check) then vite build — catches both a broken build
      # and a type error a PR might introduce, same as `npm run build`
      # locally before shipping a change.
      - run: npm run build
      # Vitest over the pure-logic modules (lib/format.ts, the Crypto tab's
      # allocation math) — kept in the same job rather than a new one so a
      # renamed job doesn't silently stop matching branch protection's
      # required status checks.
      - run: npm run test

  # Every Rust crate in one job: formatting, lints and all tests of the
  # workspace. Replaces the former per-crate cli-tests / ffi-tests jobs (if
  # branch protection listed those as required checks, require `rust` now).
  #
  # - aurum-server: the black-box API suite (crates/aurum-server/tests, the
  #   Rust port of backend/tests) builds the app in-process and creates a
  #   fresh database per test from a migrated+seeded template, so it needs
  #   the Postgres service below (user must be allowed to CREATE DATABASE).
  # - aurum-cli / aurum-client: black-box tests run the real `aurum` binary
  #   against an in-process mock server, so no database or backend is needed.
  # - aurum-ffi: the mobile FFI layer must build, pass its tests against a
  #   mock server, and UniFFI must be able to generate the Swift and Kotlin
  #   bindings from the compiled library. (The iOS/Android cross builds need
  #   macOS/NDK and run locally via crates/aurum-ffi/scripts.)
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum
          POSTGRES_DB: aurum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURUM_POSTGRES_USER: aurum
      AURUM_POSTGRES_PASSWORD: aurum
      AURUM_POSTGRES_HOST: 127.0.0.1
      AURUM_POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: crates/aurum-ffi/scripts/gen-bindings.sh
      - name: Check generated bindings
        run: |
          test -s crates/aurum-ffi/bindings/swift/aurum_ffi.swift
          test -s crates/aurum-ffi/bindings/kotlin/uniffi/aurum_ffi/aurum_ffi.kt
