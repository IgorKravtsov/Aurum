name: Release CLI

# Builds the `aurum` binary for Linux and macOS (x86_64 and aarch64) when a
# version tag is pushed and attaches the archives to the GitHub release.
# install-cli-pi-srv.sh downloads exactly these assets:
#   aurum-<target>.tar.gz (contains the single file `aurum`) + .sha256
# Tag format: vX.Y.Z, and it must equal [workspace.package] version in Cargo.toml.
on:
  push:
    tags: ["v*"]

# Both jobs publish release assets, so they need write access to contents.
permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A tag that disagrees with Cargo.toml would publish a binary whose
      # `aurum --version` contradicts the release name.
      - name: Check tag against the workspace version
        run: |
          version=$(awk '/^\[workspace\.package\]/{s=1; next} /^\[/{s=0} s && /^version *=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Create the release (if it does not exist yet)
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Aurum $GITHUB_REF_NAME" --generate-notes

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on the oldest available runners to keep the glibc
          # requirement low (Raspberry Pi OS and other LTS distributions).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p aurum-cli --target ${{ matrix.target }}
      - name: Package and upload
        run: |
          binary=target/${{ matrix.target }}/release/aurum
          strip "$binary"
          archive=aurum-${{ matrix.target }}.tar.gz
          tar -czf "$archive" -C "$(dirname "$binary")" aurum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --clobber
