# Cargo workspace for the Rust rewrite of Aurum (see docs/adr/0001 and 0002).
# Dependency graph: aurum-domain <- aurum-server, aurum-client;
#                   aurum-client <- aurum-cli, aurum-ffi.
# Versions are pinned here once and inherited by every crate
# (`dep = { workspace = true }`), so all crates always agree on them;
# Cargo.lock is committed for reproducible builds.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.3.2"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
aurum-domain = { path = "crates/aurum-domain" }
aurum-client = { path = "crates/aurum-client" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "original-uri"] }
bigdecimal = { version = "0.4.11", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
dotenvy = "0.15.7"
http-body-util = "0.1.5"
num-bigint = "0.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "bigdecimal", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "6.0.0", features = ["chrono", "preserve_order"] }
utoipa-axum = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
